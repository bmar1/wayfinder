services:
  db:
    image: postgis/postgis:16-3.5
    container_name: wayfinder-postgis
    environment:
      POSTGRES_DB: wayfinder
      POSTGRES_USER: wayfinder
      POSTGRES_PASSWORD: wayfinder
    ports:
      - "5432:5432"
    volumes:
      - wayfinder_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfinder -d wayfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wayfinder_pg:
