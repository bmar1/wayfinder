spring.application.name=wayfinder

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wayfinder}
spring.datasource.username=${DATABASE_USER:wayfinder}
spring.datasource.password=${DATABASE_PASSWORD:wayfinder}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
